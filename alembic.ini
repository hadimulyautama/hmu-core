# Alembic core — hanya untuk tabel MASTER. version_table dipisah di env.py
# (alembic_version_core) agar aman berbagi DB dengan chain produksi & kantor.
[alembic]
script_location = migrations
prepend_sys_path = .
# URL diisi dari env DATABASE_URL oleh migrations/env.py — jangan hardcode di sini.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
